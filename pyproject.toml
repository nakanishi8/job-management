[project]
name = "streamlit-job-manager"
version = "1.0.0"
description = "Streamlitを使用した長時間処理対応のジョブ管理システム"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-ulid>=3.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "ruff>=0.11.10",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]