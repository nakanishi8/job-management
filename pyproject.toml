[project]
name = "streamlit-job-manager"
version = "1.0.0"
description = "Streamlitを使用した長時間処理対応のジョブ管理システム"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.53.0",
    "pandas>=2.3.2",
    "sqlalchemy>=2.0.46",
    "pydantic>=2.12.5",
    "python-ulid>=3.1.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]